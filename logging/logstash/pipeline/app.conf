# Lab 3 - logstash pipeline: collect the app log file, parse it, index into elasticsearch
input {
  file {
    path => "/var/log/lab3/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => plain { charset => "UTF-8" }
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:level} %{GREEDYDATA:log_message}"
    }
  }
  date {
    match => ["log_time", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["message", "log_time", "host", "path", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "lab3-app-logs"
  }
}
